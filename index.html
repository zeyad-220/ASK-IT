<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AskIT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231f5c47'/%3E%3Cpath d='M16 20h32v22H28l-12 9z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--head:Georgia,'Times New Roman','Noto Naskh Arabic','Segoe UI',serif;--body:'Segoe UI',system-ui,-apple-system,'Noto Sans Arabic',Roboto,sans-serif;--r:20px;--ease:cubic-bezier(.2,.7,.2,1)}
:root,[data-mode=light]{--bg:#f4efe6;--bg2:#faf7f1;--card:#fffdf9;--ink:#1d2a24;--mute:#68705f;--line:#e2dacb;--accent:#1f5c47;--accent2:#2e7d62;--onaccent:#fff;--soft:#e5efe9;--ring:rgba(31,92,71,.2);--shadow:0 18px 40px -24px rgba(60,45,20,.38);--shadow2:0 28px 60px -26px rgba(60,45,20,.5);--glow:#e8dcc3;--warn:#c4752a;--bad:#c0463b;--good:#2f8f5b;--info:#3f6fb5}
[data-mode=dark]{--bg:#0f1713;--bg2:#15201b;--card:#18241f;--ink:#eef2ec;--mute:#93a39a;--line:#26362e;--accent:#6fcf9f;--accent2:#8be0b4;--onaccent:#0b1a13;--soft:rgba(111,207,159,.12);--ring:rgba(111,207,159,.25);--shadow:0 20px 44px -26px #000;--shadow2:0 30px 70px -26px #000;--glow:#1d3a2c;--warn:#e8a15a;--bad:#ef7d72;--good:#6fcf9f;--info:#7aa7e6}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{min-height:100vh;font-family:var(--body);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;background:radial-gradient(1200px 520px at 85% -10%,var(--glow) 0,transparent 60%),var(--bg);transition:background .4s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 0;position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--head);font-weight:700;font-size:22px;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);transition:transform .5s var(--ease)}
.brand:hover .logo{transform:rotate(-12deg) scale(1.08)}.logo svg{width:22px;height:22px}
.tabs{position:relative;display:flex;gap:2px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow)}
.tab{position:relative;z-index:1;border:0;background:none;padding:9px 18px;border-radius:99px;font-size:14.5px;font-weight:600;color:var(--mute);transition:color .25s;white-space:nowrap}
.tab.on{color:var(--onaccent)}
.tab .n{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-inline-start:6px;border-radius:99px;background:var(--accent);color:var(--onaccent);font-size:11px}
.tab.on .n{background:var(--onaccent);color:var(--accent)}
.ind{position:absolute;top:4px;bottom:4px;border-radius:99px;background:var(--accent);transition:all .45s var(--ease);box-shadow:0 8px 18px -8px var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:.25s var(--ease)}
.ib:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .dot{position:absolute;top:7px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card);display:none}
.ib.has .dot{display:block;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(192,70,59,.5)}100%{box-shadow:0 0 0 9px transparent}}
.lg{height:40px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;transition:.25s var(--ease)}.lg:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
/* notif panel */
.np{position:absolute;top:64px;inset-inline-end:28px;width:340px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow2);padding:8px;display:none;z-index:40;transform-origin:top right}
.np.open{display:block;animation:pop .3s var(--ease)}
.np h4{padding:10px 12px 6px;font-family:var(--head);font-size:16px;display:flex;justify-content:space-between;align-items:center}
.np h4 button{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600}
.ni{display:flex;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:14px;transition:background .2s}.ni:hover{background:var(--soft)}
.ni i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:transparent}.ni.u i{background:var(--accent)}
.ni small{display:block;color:var(--mute);font-size:12px}
.np .empty{padding:20px;text-align:center;color:var(--mute);font-size:14px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}}
/* generic */
h1,h2{font-family:var(--head);letter-spacing:-.02em;font-weight:500}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}[dir=rtl] .eyebrow{letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.view{display:none}.view.on{display:block;animation:vin .55s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(16px)}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}.rv.in{opacity:1;transform:none}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;padding:30px 0 34px;align-items:end}
.hero h1{font-size:clamp(40px,6.4vw,68px);line-height:1.04;margin-top:8px}
.hero h1 em{color:var(--accent);font-style:italic;position:relative;white-space:nowrap}
.hero h1 em:after{content:"";position:absolute;inset-inline:0;bottom:-4px;height:6px;border-radius:6px;background:var(--accent);opacity:.18;transform-origin:left;animation:ul 1.1s .5s var(--ease) both}
[dir=rtl] .hero h1 em:after{transform-origin:right}
@keyframes ul{from{transform:scaleX(0)}}
.lead{color:var(--mute);font-size:18px;max-width:540px;margin-top:16px}
.stamp{justify-self:end;width:190px;height:190px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--head);font-style:italic;font-size:19px;padding:22px;transform:rotate(-8deg);animation:sw 6s ease-in-out infinite alternate;position:relative}
.stamp:before{content:"";position:absolute;inset:7px;border:1px dashed var(--mute);border-radius:50%}
@keyframes sw{to{transform:rotate(5deg)}}
.main{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}
/* progress */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:13px;color:var(--mute);font-weight:600}
.prog .bar2{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.prog .bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .6s var(--ease)}
.step{padding:26px;transition:box-shadow .3s,transform .3s var(--ease)}.step+.step{margin-top:18px}
.step.done{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:var(--head);font-weight:700;font-size:19px}
.num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-family:var(--body);transition:.4s var(--ease)}
.step.done .num{background:var(--accent);color:var(--onaccent);transform:rotate(360deg)}
.step.done .num span{display:none}.step.done .num:after{content:"✓";font-size:15px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:800px}
.cat{border:1.5px solid var(--line);background:var(--bg2);border-radius:16px;padding:16px 8px;text-align:center;font-weight:600;font-size:14px;transition:transform .2s,box-shadow .25s,border-color .25s,background .25s;transform-style:preserve-3d}
.cat svg{width:28px;height:28px;display:block;margin:0 auto 8px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.3s var(--ease)}
.cat:hover{box-shadow:var(--shadow2)}.cat:hover svg{transform:scale(1.18) rotate(-6deg)}
.cat.on{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 3px var(--ring);animation:pk .35s}
@keyframes pk{50%{scale:1.06}}
.urg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.u{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--bg2);text-align:start;transition:.25s var(--ease)}
.u b{display:block;font-size:15px}.u small{color:var(--mute);font-size:12.5px;display:block}.u i{display:block;width:10px;height:10px;border-radius:50%;margin-bottom:8px}
.u:hover{transform:translateY(-3px)}.u.on{border-color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
label{font-size:13px;color:var(--mute);font-weight:600;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg2);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
textarea{min-height:120px;resize:vertical}
.bad input,.bad textarea,.bad select{border-color:var(--bad)}.bad{animation:shk .4s}.err{color:var(--bad);font-size:12.5px;margin-top:4px;display:none}.bad .err{display:block}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cc{font-size:12px;color:var(--mute);text-align:end;margin-top:4px}
.dz{margin-top:14px;border:1.8px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--mute);font-size:14px;transition:.25s;background:var(--bg2)}
.dz.over,.dz:hover{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.dz svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 6px}
.dz u{color:var(--accent);font-weight:600;cursor:pointer}
.files{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.fc{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px;animation:pop .3s var(--ease)}
[dir=rtl] .fc{padding:6px 6px 6px 8px}
.fc .th{width:34px;height:34px;border-radius:8px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-size:10px;font-weight:700;color:var(--accent)}.fc .th img{width:100%;height:100%;object-fit:cover}
.fc small{display:block;color:var(--mute);font-size:11px}.fc button{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:0 4px}
.go{width:100%;margin-top:20px;padding:16px;border:0;border-radius:16px;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:16px;transition:.25s var(--ease);box-shadow:0 12px 26px -12px var(--accent);position:relative;overflow:hidden}
.go:hover{transform:translateY(-2px)}.go:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-120%);animation:shn 3.6s infinite}
@keyframes shn{to{transform:translateX(120%)}}
.go.sending{pointer-events:none;opacity:.8}
/* aside */
aside{position:sticky;top:96px}aside .card{padding:22px}aside .card+.card{margin-top:16px}
aside h3{font-family:var(--head);font-size:18px;margin-bottom:10px}
.pv .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.pv .row span:first-child{color:var(--mute)}.pv .row:last-child{border:0}
.tip{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:14.5px;color:var(--mute);animation:vin .4s var(--ease) both}.tip:first-of-type{border:0}.tip b{color:var(--accent)}
.art{display:block;width:100%;text-align:start;border:0;background:none;padding:10px 12px;margin:0 -12px;width:calc(100% + 24px);border-radius:12px;font-size:14.5px;transition:background .2s}.art:hover{background:var(--soft)}.art small{display:block;color:var(--mute);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent)}
.badge.s1{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}.badge.s2{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.badge.s3{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
/* success */
#ok{display:none;padding:36px;text-align:center;position:relative;overflow:hidden}
.seal{width:130px;height:130px;margin:0 auto 14px;border:3px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-family:var(--head);font-style:italic;font-size:18px;transform:rotate(-10deg);animation:slam .6s var(--ease) both;position:relative}
.seal:before{content:"";position:absolute;inset:6px;border:1px dashed var(--accent);border-radius:50%}
@keyframes slam{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
.tid{font-family:var(--head);font-size:40px;color:var(--accent);letter-spacing:.02em}
.hl{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s var(--ease)}.pill:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pill.pr{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.conf{position:absolute;inset:0;pointer-events:none}.conf i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
/* timeline */
.tl{display:flex;margin:26px auto 0;max-width:560px}.tl .p{flex:1;position:relative;padding-top:26px;font-size:13px;color:var(--mute);font-weight:600}
.tl .p:before{content:"";position:absolute;top:6px;inset-inline:-50% 50%;height:3px;background:var(--line)}.tl .p:first-child:before{display:none}
.tl .p:after{content:"";position:absolute;top:0;inset-inline-start:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--line);transition:.4s}
.tl .p:after{z-index:1}.tl .p.d{color:var(--ink)}.tl .p.d:after{background:var(--accent);border-color:var(--accent)}.tl .p.d:before{background:var(--accent)}
.tl .p.c:after{box-shadow:0 0 0 6px var(--ring)}
/* tickets */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 22px}.sum .card{padding:20px 22px}.sum b{font-family:var(--head);font-size:42px;font-weight:500;display:block;line-height:1}.sum span{color:var(--mute);font-size:14px}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.flt input{max-width:300px;padding:10px 14px}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;color:var(--mute);transition:.25s}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tk{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 20px;margin-bottom:12px;width:100%;text-align:start;transition:transform .25s var(--ease),box-shadow .25s;border-radius:var(--r)}
.tk:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.tk .ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center}.tk .ic svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tk b{font-size:16px;display:block}.tk small{color:var(--mute);font-size:13px}.tk .r{text-align:end;display:flex;flex-direction:column;gap:6px;align-items:flex-end}[dir=rtl] .tk .r{align-items:flex-start}
.mini{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px;max-width:260px}.mini i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .6s var(--ease)}
.empty2{padding:50px 20px;text-align:center;color:var(--mute)}.empty2 h3{font-family:var(--head);color:var(--ink);font-size:22px;margin-bottom:6px}
/* help */
.hh{padding:20px 0 24px}.hh h1{font-size:clamp(34px,5vw,54px)}
.hs{position:relative;max-width:560px;margin-top:20px}.hs svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}.hs input{padding:16px 16px;padding-inline-start:46px;border-radius:99px;font-size:16px}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.fq{padding:0;overflow:hidden;transition:box-shadow .3s}.fq.open{box-shadow:var(--shadow2);border-color:var(--accent)}
.fq>button{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:start;padding:18px 20px;border:0;background:none;font-weight:600;font-size:15.5px}
.fq>button:after{content:"+";font-size:22px;color:var(--accent);transition:transform .3s var(--ease)}.fq.open>button:after{transform:rotate(45deg)}
.fq .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}.fq.open .a{grid-template-rows:1fr}.fq .a>div{overflow:hidden}.fq .a p{padding:0 20px 18px;color:var(--mute);font-size:14.5px}
.fq .a ol{padding:0 20px 18px 40px;color:var(--mute);font-size:14.5px;margin:0}[dir=rtl] .fq .a ol{padding:0 40px 18px 20px}
.cb{font-size:11.5px;color:var(--accent);background:var(--soft);padding:2px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.help-cta{margin-top:26px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.help-cta h3{font-family:var(--head);font-size:22px;font-weight:500}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(10,15,12,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}.ov.open{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:520px;max-width:100vw;background:var(--card);box-shadow:var(--shadow2);z-index:60;transform:translateX(105%);transition:transform .5s var(--ease);overflow:auto;padding:26px}
[dir=rtl] .dr{transform:translateX(-105%)}.dr.open{transform:none}
.dr h2{font-size:28px;margin:10px 0 6px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.mg div{padding:10px 12px;background:var(--bg2);border-radius:12px;font-size:13.5px}.mg small{display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}[dir=rtl] .mg small{letter-spacing:0}
.dr h4{font-family:var(--head);font-size:17px;margin:20px 0 10px}
.act{display:flex;gap:10px;margin-bottom:12px;font-size:14px}.act .av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}.act .av.me{background:var(--ink);color:var(--bg)}
.act div div{padding:10px 14px;background:var(--bg2);border-radius:4px 14px 14px 14px;margin-top:2px}.act small{color:var(--mute);font-size:12px}
.nf{display:flex;gap:8px;margin-top:12px}.nf input{flex:1}.nf button{border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--onaccent);font-weight:600}
.x{position:absolute;top:18px;inset-inline-end:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px}
.vt{display:flex;flex-direction:column;gap:0;margin:6px 0}.vt div{position:relative;padding:0 0 18px;padding-inline-start:30px;font-size:14px;color:var(--mute)}.vt div:before{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:-2px;width:2px;background:var(--line)}.vt div:last-child:before{display:none}
